<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐月母婴积分商城 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-container {
            padding-bottom: 50px;
            min-height: 100vh;
            background-color: #ffffff;
        }
        
        .page-header {
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }
        
        .login-form {
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f9f9;
        }
        
        .form-input:focus {
            border-color: #b7286c;
            outline: none;
        }
        
        .forgot-password {
            text-align: right;
            font-size: 14px;
            margin-top: 5px;
            color: #b7286c;
        }
        
        .login-button {
            background-color: #b7286c;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 30px;
            border: none;
            font-weight: 500;
        }
        
        .register-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            color: #666;
        }
        
        .register-link {
            color: #b7286c;
            margin-left: 5px;
            font-weight: 500;
        }
        
        .welcome-text {
            text-align: center;
            font-size: 24px;
            margin: 30px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div>14:42</div>
        <div>
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi ml-1"></i>
            <i class="fas fa-battery-full ml-1"></i>
        </div>
    </div>

    <!-- 页面头部 -->
    <div class="page-header">
        <div style="height: 44px; display: flex; align-items: center; justify-content: center;">
            乐月母婴积分商城
        </div>
    </div>

    <div class="page-container">
        <div class="welcome-text">欢迎回来</div>
        
        <div class="login-form">
            <form action="home.html">
                <div class="form-group">
                    <label for="phone" class="form-label">手机号码</label>
                    <input type="tel" id="phone" class="form-input" placeholder="请输入手机号码" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                </div>
                
                <div class="forgot-password">
                    <a href="#">忘记密码?</a>
                </div>
                
                <button type="submit" class="login-button">
                    登录
                </button>
                
                <div class="register-section">
                    <span>还没有账号?</span>
                    <a href="#" class="register-link">立即注册</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 为演示目的，直接提供默认用户名密码
            document.getElementById('phone').value = '13800138000';
            document.getElementById('password').value = '123456';
        });
    </script>
</body>
</html>
