<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐月母婴积分商城 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffcce6;
            padding-top: 80px;
        }
        
        .logo-container {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #b7286c;
            margin-bottom: 4px;
        }
        
        .subtitle {
            color: #777;
            font-size: 14px;
        }
        
        .login-box {
            background-color: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            flex-grow: 1;
            padding: 30px 20px;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
        }
        
        .welcome-text {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
            color: #333;
        }
        
        .login-button {
            background-color: #07c160;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-bottom: 16px;
        }
        
        .other-login {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin: 20px 0;
            position: relative;
        }
        
        .other-login::before, .other-login::after {
            content: "";
            display: block;
            width: 25%;
            height: 1px;
            background-color: #e0e0e0;
            position: absolute;
            top: 50%;
        }
        
        .other-login::before {
            left: 10%;
        }
        
        .other-login::after {
            right: 10%;
        }
        
        .phone-login {
            background-color: white;
            color: #333;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid #e0e0e0;
        }
        
        .privacy-policy {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 30px;
        }
        
        .privacy-link {
            color: #b7286c;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div>14:42</div>
        <div>
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi ml-1"></i>
            <i class="fas fa-battery-full ml-1"></i>
        </div>
    </div>

    <div class="login-container">
        <div class="logo-container">
            <img src="https://images.unsplash.com/photo-1601839430100-7cca5255da92?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&h=200&q=80" alt="乐月母婴" class="logo">
            <h1 class="title">乐月母婴积分商城</h1>
            <p class="subtitle">关爱宝宝 乐享积分</p>
        </div>
        
        <div class="login-box">
            <p class="welcome-text">欢迎使用乐月母婴积分商城</p>
            
            <button class="login-button" onclick="location.href='home.html'">
                <i class="fab fa-weixin mr-2"></i> 微信一键登录
            </button>
            
            <div class="other-login">其他登录方式</div>
            
            <button class="phone-login" onclick="location.href='home.html'">
                <i class="fas fa-mobile-alt mr-2"></i> 手机号登录
            </button>
            
            <p class="privacy-policy">
                登录即表示您已同意<a href="#" class="privacy-link">《用户协议》</a>和<a href="#" class="privacy-link">《隐私政策》</a>
            </p>
        </div>
    </div>
</body>
</html>
