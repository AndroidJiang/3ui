<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐月母婴积分商城 - 原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .title {
            color: #b7286c;
            margin-bottom: 1.5rem;
        }
        .description {
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .features {
            text-align: left;
            margin-bottom: 2rem;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .feature-icon {
            color: #b7286c;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
        .navigation {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .nav-btn-primary {
            background-color: #b7286c;
            color: white;
        }
        .nav-btn-primary:hover {
            background-color: #a12562;
        }
        .nav-btn-secondary {
            background-color: #f3d5e2;
            color: #b7286c;
        }
        .nav-btn-secondary:hover {
            background-color: #efc5d8;
        }
        .nav-btn-alternate {
            background-color: #7c4dff;
            color: white;
        }
        .nav-btn-alternate:hover {
            background-color: #6c3df7;
        }
        .btn-icon {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title text-3xl font-bold">乐月母婴积分商城</h1>
        
        <p class="description">
            欢迎使用乐月母婴积分商城小程序原型。这是一个专为母婴门店会员积分兑换设计的小程序，
            用户可以使用消费积分兑换各种母婴产品。以下是主要页面预览：
        </p>
        
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <span>微信一键登录/手机号登录</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <span>母婴商品展示与兑换</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <span>积分管理与订单查询</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-check-circle feature-icon"></i>
                <span>个人中心与客服联系</span>
            </div>
        </div>
        
        <div class="navigation">
            <a href="login.html" class="nav-btn nav-btn-primary">
                <i class="fas fa-sign-in-alt btn-icon"></i>
                登录页面
            </a>
            <a href="home.html" class="nav-btn nav-btn-primary">
                <i class="fas fa-home btn-icon"></i>
                首页
            </a>
            <a href="profile.html" class="nav-btn nav-btn-primary">
                <i class="fas fa-user btn-icon"></i>
                个人中心
            </a>
            <a href="exchange.html" class="nav-btn nav-btn-primary">
                <i class="fas fa-exchange-alt btn-icon"></i>
                兑换页面
            </a>
            <a href="all-views.html" class="nav-btn nav-btn-alternate">
                <i class="fas fa-th-large btn-icon"></i>
                全页面预览
            </a>
        </div>
    </div>
</body>
</html>
